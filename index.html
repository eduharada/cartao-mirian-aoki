<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Dra. Mirian Aoki | Psiquiatra</title>
<style>
:root{--green:#173b31;--sage:#6f846f;--gold:#b49066;--cream:#fbf8f1;--line:#ded8cb}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eeeee9;font-family:Arial,sans-serif;color:var(--green)}
.card{width:min(100%,440px);background:linear-gradient(145deg,#fffdfa,#edf1e8);border:1px solid var(--line);border-radius:30px;box-shadow:0 20px 55px #0002;padding:30px 24px;overflow:hidden;position:relative}
.card:before,.card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:#91a58b20;z-index:0}.card:before{left:-95px;top:-70px}.card:after{right:-100px;bottom:-85px}
main{position:relative;z-index:1}.logo{width:78px;height:78px;margin:0 auto 12px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:42px Georgia,serif;color:var(--sage)}
h1{text-align:center;font:500 36px/1.1 Georgia,serif;margin:8px 0;color:#12352c}.role{text-align:center;letter-spacing:.34em;color:var(--gold);font-weight:700;font-size:13px}.tag{text-align:center;color:#607068;font-size:12px;letter-spacing:.08em;margin:14px auto 24px;line-height:1.55}
.links{display:grid;gap:13px}.btn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:19px;color:#fff;text-decoration:none;box-shadow:0 8px 20px #0002;transition:.18s ease}.btn:hover,.btn:focus-visible{transform:translateY(-2px);filter:brightness(1.05);outline:3px solid #b4906645}.wa{background:linear-gradient(135deg,#287b50,#1f6744)}.ig{background:linear-gradient(105deg,#f28743,#d33678,#8738aa)}
.icon{width:45px;height:45px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;flex:none;font-size:21px}.text{display:flex;flex-direction:column;gap:4px;font-size:18px;font-weight:700}.text small{font-size:13px;font-weight:400;opacity:.95}.arrow{margin-left:auto;font-size:30px;font-weight:300}
.quote{text-align:center;font:italic 18px/1.55 Georgia,serif;color:#56705f;margin:27px 20px 12px}.footer{text-align:center;border-top:1px solid var(--line);padding-top:16px;margin-top:20px;color:#718078;font-size:10px;letter-spacing:.18em}
@media(max-width:360px){.card{padding:25px 17px}h1{font-size:31px}.text{font-size:16px}}
</style>
</head>
<body>
<main class="card" aria-label="Cartão digital da Dra. Mirian Aoki">
  <div class="logo" aria-hidden="true">❧</div>
  <h1>Dra. Mirian Aoki</h1>
  <div class="role">PSIQUIATRA</div>
  <div class="tag">SAÚDE MENTAL • QUALIDADE DE VIDA • BEM-ESTAR</div>
  <div class="links">
    <a class="btn wa" href="https://wa.me/5511930360317" target="_blank" rel="noopener noreferrer" aria-label="Falar com Dra. Mirian Aoki pelo WhatsApp">
      <span class="icon" aria-hidden="true">☎</span><span class="text">Falar no WhatsApp<small>+55 (11) 93036-0317</small></span><span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="btn ig" href="https://www.instagram.com/mirianaoki_psiquiatra/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram mirianaoki_psiquiatra">
      <span class="icon" aria-hidden="true">◎</span><span class="text">Instagram<small>@mirianaoki_psiquiatra</small></span><span class="arrow" aria-hidden="true">›</span>
    </a>
  </div>
  <p class="quote">“Cuidar da saúde mental é investir em uma vida mais plena.”</p>
  <div class="footer">CARTÃO DIGITAL • DRA. MIRIAN AOKI</div>

</body>
</html>
